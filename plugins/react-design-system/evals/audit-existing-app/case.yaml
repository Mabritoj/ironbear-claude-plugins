schema_version: "1.1"
name: audit-existing-app
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The app is below the auditor's size threshold, so the run measures drift itself (reading the files and/or running greps) without spawning the design-drift-auditor agent, and writes docs/design-system-audit.md from its report: findings with counts and file names covering Taskboard's real drift (hex literals in Button/Card/ProjectList modules and the inline SVG in Logo.tsx, button:focus { outline: none } with no :focus-visible replacement, hue-named tokens, :root[data-theme] scoping with a partial dark theme, color-mix() token, IconButton's optional label leaving two header buttons unnamed, Card navigating via onClick + navigate(), the ALL-CAPS "PROJECTS" heading, a page-local 1080px max-width), then a phased plan ordered baseline/guardrails -> tokens -> primitives -> overlays -> migrate -> lock in, with decisions needed. No source files changed.
